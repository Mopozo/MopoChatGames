name: MopoChatGames
version: '${version}'

main: mopo.mopoChatGames.MopoChatGames
api-version: '1.21.11'
load: POSTWORLD
commands:
  runchatgame:
    description: Starts a chat game and broadcasts it
    usage: /runchatgame <game>
  endchatgame:
    description: Ends current chat game
    usage: /endchatgame
  OpenRewardLootPool:
    usage: /openrewardlootpool